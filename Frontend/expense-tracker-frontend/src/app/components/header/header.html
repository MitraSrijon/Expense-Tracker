<header class="header">
  <div class="title-section">
    <h1>Expense Tracker</h1>
    <p class="subtitle">Manage and track your daily expenses.</p>
  </div>

  <div class="header-controls">
    <input
      type="text"
      placeholder="Search expenses..."
      [(ngModel)]="searchText"
      (input)="searchChanged.emit(searchText)"
    />

    <select (change)="categoryChanged.emit($any($event.target).value)">
      <option value="ALL">All Categories</option>
      <option value="FOOD">Food</option>
      <option value="TRANSPORT">Transport</option>
      <option value="SHOPPING">Shopping</option>
      <option value="BILLS">Bills</option>
      <option value="ENTERTAINMENT">Entertainment</option>
      <option value="OTHER">Other</option>
    </select>

    <select (change)="sortChanged.emit($any($event.target).value)">
      <option value="NEWEST">Newest</option>
      <option value="OLDEST">Oldest</option>
      <option value="HIGH">Highest Amount</option>
      <option value="LOW">Lowest Amount</option>
    </select>

    <select (change)="monthChanged.emit($any($event.target).value)">
      <option value="ALL">All Months</option>

      <option value="2026-01">January 2026</option>
      <option value="2026-02">February 2026</option>
      <option value="2026-03">March 2026</option>
      <option value="2026-04">April 2026</option>
      <option value="2026-05">May 2026</option>
      <option value="2026-06">June 2026</option>
      <option value="2026-07">July 2026</option>
      <option value="2026-08">August 2026</option>
      <option value="2026-09">September 2026</option>
      <option value="2026-10">October 2026</option>
      <option value="2026-11">November 2026</option>
      <option value="2026-12">December 2026</option>
    </select>

    <button class="add-btn" (click)="addExpenseClicked.emit()">+ Add Expense</button>
  </div>
</header>
